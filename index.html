<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Letter ❤️</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="content">
            <h1 class="heart">❤️</h1>
            
            <h2>Для тебя, любимый</h2>
            
            <p class="message">
                Я просто хотела сказать,<br>
                что ты — очень важный человек<br>
                для меня. 🥺
            </p>
            
            <p class="thank-you">
                Спасибо, что ты есть ❤️
            </p>
            
            <button class="btn" id="revealBtn">
                Нажми сюда 💌
            </button>
            
            <div class="hidden-message" id="hiddenMessage">
                <p>Я тебя люблю ❤️</p>
                <p>И надеюсь, ты всегда будешь рядом со мной. 🫶</p>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
